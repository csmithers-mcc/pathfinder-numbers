<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 340" width="100%" role="img" aria-label="Core Web Vitals baseline chart"><rect x="0" y="0" width="900" height="340" fill="#f3f1ea"/><g transform="translate(20,20)">
