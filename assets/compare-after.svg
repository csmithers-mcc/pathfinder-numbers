<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 660" width="100%" role="img" aria-label="Illustrative wireframe of the Pathfinder homepage layout with annotations tying each change to a measured metric">
<rect x="0" y="0" width="440" height="660" fill="#ffffff"/>
<rect x="0" y="0" width="440" height="660" fill="none" stroke="#d8d3c4" stroke-width="2"/>
<!-- masthead (identical) -->
<text x="220" y="34" font-family="Georgia, serif" font-size="20" font-weight="700" fill="#1a1d1f" text-anchor="middle">Your Publication</text>
<line x1="20" y1="48" x2="420" y2="48" stroke="#d8d3c4" stroke-width="1.5"/>
<!-- nav (identical) -->
<g font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#52585e">
 <text x="40" y="68">News</text>
 <text x="90" y="68">Sports</text>
 <text x="145" y="68">Business</text>
 <text x="205" y="68">More</text>
</g>
<line x1="20" y1="78" x2="420" y2="78" stroke="#d8d3c4" stroke-width="1"/>
<!-- smaller ad slot -->
<rect x="20" y="96" width="400" height="48" fill="#f2e1d4" stroke="#c4471c" stroke-dasharray="4,3"/>
<text x="220" y="124" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#c4471c" text-anchor="middle">AD</text>
<!-- sidebar + hero, reorganized -->
<g>
 <text x="20" y="166" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#52585e">LATEST</text>
 <rect x="20" y="176" width="110" height="7" fill="#a7aeb6"/>
 <rect x="20" y="190" width="100" height="7" fill="#a7aeb6"/>
 <line x1="20" y1="206" x2="130" y2="206" stroke="#d8d3c4" stroke-width="1"/>
 <rect x="20" y="216" width="110" height="7" fill="#a7aeb6"/>
 <rect x="20" y="230" width="90" height="7" fill="#a7aeb6"/>
 <line x1="20" y1="246" x2="130" y2="246" stroke="#d8d3c4" stroke-width="1"/>
 <rect x="20" y="256" width="110" height="7" fill="#a7aeb6"/>
 <rect x="20" y="270" width="95" height="7" fill="#a7aeb6"/>
</g>
<g>
 <rect x="150" y="166" width="270" height="130" fill="#e8e5db"/>
 <rect x="150" y="312" width="250" height="10" fill="#1a1d1f"/>
 <rect x="150" y="328" width="190" height="10" fill="#1a1d1f"/>
 <rect x="150" y="348" width="260" height="7" fill="#a7aeb6"/>
</g>

<!-- annotation leader lines -->
<line x1="220" y1="144" x2="220" y2="410" stroke="#c4471c" stroke-width="1" stroke-dasharray="3,3"/>
<line x1="285" y1="296" x2="285" y2="470" stroke="#1f6f4e" stroke-width="1" stroke-dasharray="3,3"/>
<line x1="80" y1="48" x2="80" y2="594" stroke="#52585e" stroke-width="1" stroke-dasharray="3,3"/>

<!-- annotation legend -->
<line x1="20" y1="400" x2="420" y2="400" stroke="#d8d3c4" stroke-width="1"/>
<g font-family="Helvetica, Arial, sans-serif" font-size="11">
 <circle cx="28" cy="420" r="4" fill="#c4471c"/>
 <text x="40" y="424" fill="#1a1d1f" font-weight="600">Ad slot shrinks</text>
 <text x="40" y="438" fill="#52585e">~81 KB total page weight, vs. ~871 KB today</text>

 <circle cx="28" cy="458" r="4" fill="#1f6f4e"/>
 <text x="40" y="462" fill="#1a1d1f" font-weight="600">Content loads higher</text>
 <text x="40" y="476" fill="#52585e">Ties to the faster Largest Contentful Paint measured below</text>

 <circle cx="28" cy="496" r="4" fill="#52585e"/>
 <text x="40" y="500" fill="#1a1d1f" font-weight="600">Masthead &amp; nav unchanged</text>
 <text x="40" y="514" fill="#52585e">Same brand, same navigation &#8212; no redesign risk</text>
</g>
<text x="20" y="625" font-family="Helvetica, Arial, sans-serif" font-size="10" font-style="italic" fill="#a7aeb6">Illustrative structure only &#8212; not a real screenshot. Numbers match the charts below.</text>
</svg>
